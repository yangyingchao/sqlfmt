[package]
name = "sqlfmt"
version = "0.5.7"
edition = "2021"
authors = ["yangyingchao <yang.yingchao@qq.com>"]
description = "SQL formatter with intelligent WITH clause compression and Greenplum dialect support"
license = "MIT"

[[bin]]
name = "sqlfmt"
path = "src/main.rs"

[dependencies]
sqlparser = "0.62"
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"
lazy_static = "1.4"
thiserror = "1.0"
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
